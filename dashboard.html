<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin</title>
    <link rel="icon" type="image/png" href="/src/assets/img/logo.png" />

    <!-- css -->
    <link rel="stylesheet" href="/src/assets/font-awesome/css/all.min.css" />
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="bg-background">
    <main>
      <section id="login-view" class="grid-bg grow-screen">
        <div class="w-full h-dvh flex flex-col md:flex-row">
          <div
            class="flex items-center justify-center px-2 md:px-12 md:py-0 w-full md:w-[60%] flex-1"
          >
            <div class="w-[90%] md:w-[50%]">
              <div
                class="relative bg-white border-3 border-black shadow-[6px_6px_0] p-6"
              >
                <div class="flex flex-col items-center gap-3 mb-6">
                  <img
                    class="w-[40%]"
                    src="/src/assets/img/logo/logo.png"
                    alt="Logo HEXS"
                  />
                  <h1 class="font-title font-bold text-2xl text-center">
                    Akses Dashboard
                  </h1>
                  <p
                    class="font-body font-medium text-sm text-center text-slate-600"
                  >
                    Kelola projek portofoliomu dari sini.
                  </p>
                </div>

                <form id="login-form" class="flex flex-col gap-4">
                  <div class="flex flex-col gap-1">
                    <label
                      for="username"
                      class="font-label font-bold text-sm flex items-center gap-2"
                    >
                      <i class="fa-solid fa-user"></i> Username
                    </label>
                    <input
                      type="text"
                      id="username"
                      name="username"
                      autocomplete="username"
                      required
                      placeholder="Masukkan username"
                      class="bg-background border-2 border-black px-2 py-2 font-body text-base focus:outline-none focus:shadow-[2px_2px_0] focus:bg-white transition"
                    />
                  </div>

                  <div class="flex flex-col gap-1">
                    <label
                      for="password"
                      class="font-label font-bold text-sm flex items-center gap-2"
                    >
                      <i class="fa-solid fa-lock"></i> Password
                    </label>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      autocomplete="current-password"
                      required
                      placeholder="Masukkan password"
                      class="bg-background border-2 border-black px-2 py-2 font-body text-base focus:outline-none focus:shadow-[2px_2px_0] focus:bg-white transition"
                    />
                  </div>

                  <p
                    id="login-error"
                    class="hidden font-body font-medium text-xs text-red-700 bg-red-100 border-2 border-red-700 px-3 py-2"
                  >
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                    Username atau password salah.
                  </p>

                  <button
                    type="submit"
                    class="mt-2 w-full flex justify-center items-center gap-2 bg-sidebar border-3 border-black font-label font-bold text-sm px-5 py-3 shadow-[3px_3px_0] hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all duration-200"
                  >
                    Masuk <i class="fa-solid fa-arrow-right"></i>
                  </button>

                  <a
                    href="index.html"
                    class="w-full text-center font-label font-medium text-xs text-slate-600 hover:text-black hover:underline"
                  >
                    &larr; Kembali ke beranda
                  </a>
                </form>
              </div>
            </div>
          </div>

          <div
            class="hidden md:block md:w-[40%] relative border-3 border-black"
          >
            <img
              class="absolute inset-0 w-full h-full object-cover"
              style="filter: grayscale(100%)"
              src="/src/assets/img/ab-4.jpg"
              alt="Foto"
            />
          </div>
        </div>
      </section>

      <!-- dahsboard -->
      <section id="dashboard-view" class="hidden grow-screen bg-background">
        <!-- <header class="bg-white border-b-4 sticky top-0 z-10">
            <div
              class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between"
            >
              <div class="flex items-center gap-4">
                <img
                  class="w-13 h-13"
                  src="/src/assets/img/logo/logo.png"
                  alt="Logo HEXS"
                />
                <span class="font-title font-bold text-xl md:text-2xl"
                  >Dashboard</span
                >
              </div>
              <button
                id="logout-btn"
                class="flex items-center gap-2 bg-merah border-2 border-black font-label font-medium text-xs md:text-sm px-4 py-2 shadow-[2px_2px_0] hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all duration-200"
              >
                Logout <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            </div>
          </header> -->

        <div class="grid grid-cols-[250px_1fr]">
          <aside class="bg-white border-r-3 h-dvh">
            <div class="p-6">
              <div class="flex gap-4 justify-between items-center border-b-3">
                <img class="w-[40%]" src="src/assets/img/logo/logo.png" alt="logo" />
                <button
                  id="sidebar-close"
                  type="button"
                  class="text-2xl w-10 h-10 flex items-center justify-center rounded-full bg-sidebar shadow-[2px_2px_0] border-2 hover:rotate-90 transition-all duration-200"
                  aria-label="Tutup sidebar"
                >
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
              <nav>
                <ul>
                  <li><a href=""></a>Dashboard</li>
                  <li><a href=""></a>Projek</li>
                  <li><a href=""></a>Logout</li>
                </ul>
              </nav>
            </div>
          </aside>

          <!-- main -->
          <div class="max-w-7xl mx-auto px-6 py-10">
            <div
              class="bg-white border-3 border-black shadow-[4px_4px_0] p-8 text-center"
            >
              <i class="fa-solid fa-circle-check text-4xl text-green-600"></i>
              <h2 class="font-title font-bold text-2xl mt-4">
                Login Berhasil!
              </h2>
              <p class="font-body font-medium text-sm text-slate-600 mt-2">
                Ini kerangka dashboard. Isi kontennya (tabel projek, tambah,
                edit, hapus) menyusul di sini.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const loginView = document.getElementById("login-view");
      const dashboardView = document.getElementById("dashboard-view");
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const logoutBtn = document.getElementById("logout-btn");

      const ADMIN_USERNAME = "admin";
      const ADMIN_PASSWORD = "admin";
      const AUTH_KEY = "admin-login";

      const showDashboard = () => {
        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
      };

      const showLogin = () => {
        dashboardView.classList.add("hidden");
        loginView.classList.remove("hidden");
      };

      if (sessionStorage.getItem(AUTH_KEY) === "1") {
        showDashboard();
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = loginForm.username.value.trim();
        const password = loginForm.password.value;

        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
          sessionStorage.setItem(AUTH_KEY, "1");
          showDashboard();
        } else {
          loginError.classList.remove("hidden");
        }
      });

      logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem(AUTH_KEY);
        showLogin();
      });
    </script>
  </body>
</html>
